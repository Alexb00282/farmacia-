<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Farmavida</title>
    
    <!-- Descripción para SEO -->
    <meta name="description" content="Compra productos farmacéuticos y de cuidado personal en Farmavida.">
    
    <!-- Favicon -->
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
     <!-- Navbar fija -->
     <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img/logo 2.png" alt="Farmavida Logo" height="80" class="d-inline-block align-text-top">
                Farmavida
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="servicios.html">Servicios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">Nosotros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="carrito.html" class="btn btn-outline-success position-relative">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-count">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Encabezado de la página -->
    <div class="container mt-5 pt-3">
        <h1 class="my-4">Nuestros Productos</h1>
        
        <!-- Barra de búsqueda y filtros -->
        <div class="row mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
                <div class="input-group">
                    <input type="text" id="busqueda" class="form-control" placeholder="Buscar productos..." aria-label="Buscar productos">
                    <button class="btn btn-success" type="button" id="boton-buscar" aria-label="Buscar">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
            <div class="col-md-6">
                <select class="form-select" id="filtro-categoria">
                    <option value="todos">Todas las categorías</option>
                    <option value="medicamentos">Medicamentos</option>
                    <option value="suplementos">Suplementos</option>
                    <option value="cuidado-personal">Cuidado Personal</option>
                    <option value="dermocosmetica">Dermocosmética</option>
                    <option value="bebes">Bebés y Niños</option>
                </select>
            </div>
        </div>
        
        <!-- Contenedor de productos -->
        <div class="row g-4" id="contenedor-productos">
            <!-- Los productos se cargarán dinámicamente desde JavaScript -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>Farmavida</h5>
                    <p>Tu farmacia de confianza, cuidando tu salud desde 1995.</p>
                </div>
                <div class="col-md-3">
                    <h5>Enlaces</h5>
                    <ul class="list-unstyled">
                        <li><a href="index.html" class="text-white">Inicio</a></li>
                        <li><a href="productos.html" class="text-white">Productos</a></li>
                        <li><a href="servicios.html" class="text-white">Servicios</a></li>
                        <li><a href="nosotros.html" class="text-white">Nosotros</a></li>
                        <li><a href="contacto.html" class="text-white">Contacto</a></li>
                    </ul>
                </div>
                <div class="col-md-3">
                    <h5>Síguenos</h5>
                    <div class="d-flex gap-3 fs-4">
                        <a href="#" class="text-white"><i class="fab fa-facebook"></i></a>
                        <a href="#" class="text-white"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="text-white"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
            <hr>
            <div class="text-center">
                <p class="mb-0">© 2023 Farmavida. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <!-- Elemento de audio para la música de fondo -->
    <audio id="background-music" loop>
        <source src="audio/Alan Walker - The Spectre(MP3_160K).mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" defer></script>
    
    <!-- JavaScript personalizado -->
    <script src="js/main.js" defer></script>
    <script src="js/carrito.js" defer></script>
    <script src="js/productos.js" defer></script>

    <!-- Script para iniciar la música de fondo -->
    <script>
        window.onload = function() {
            var music = document.getElementById('background-music');
            music.volume = 0.2;  // Establece el volumen al 50%
            music.play();  // Inicia la reproducción de la música automáticamente
        };
    </script>
</body>
</html>
